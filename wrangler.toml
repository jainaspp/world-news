name = "world-news"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-06"
compatibility_flags = ["nodejs_compat"]

# Workers AI. No extra id. The account must have Workers AI enabled.
# This binding is remote-only: `wrangler pages dev` asks for CLOUDFLARE_API_TOKEN.
# Without a token, comment these three lines out. Pages still render a source draft.
[ai]
binding = "AI"

# Durable store for generated pages. Created with:
#   npx wrangler kv namespace create CONTENT
# Grok uses the Pages secret XAI_API_KEY (wrangler pages secret put XAI_API_KEY). It is not a binding.
# MiniMax uses the Pages secret MINIMAX_API_KEY. It is not a binding. Cost per call is 0.
[[kv_namespaces]]
binding = "CONTENT"
id = "807fa3f477704af287ca5a9dd3ab6bc5"

# Chronicle D1. Do not invent database_id here. After `npx wrangler d1 create world-news-chronicle`,
# uncomment and paste the id. Until then, pages read shared/civilization/db/seed.json.
# See shared/civilization/db/README.md.
# [[d1_databases]]
# binding = "CHRONICLE_DB"
# database_name = "world-news-chronicle"
# database_id = ""
