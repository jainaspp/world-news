name: Warm AI pages

on:
  schedule:
    # 07:30 HKT
    - cron: '30 23 * * *'
    # 18:30 HKT
    - cron: '30 10 * * *'
    # Sunday 20:00 HKT
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Pages to generate the current edition
        env:
          GENERATE_SECRET: ${{ secrets.GENERATE_SECRET }}
          SITE_URL: ${{ vars.CONTENT_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GENERATE_SECRET}" ]; then
            echo "GENERATE_SECRET is not set"
            exit 1
          fi
          base="${SITE_URL:-https://world-news.xyz}"
          base="${base%/}"
          auth=(-H "x-generate-secret: ${GENERATE_SECRET}" -H "content-type: application/json")
          curl -fsS -X POST "${auth[@]}" "$base/api/generate?kind=digest"
          echo
          curl -fsS -X POST "${auth[@]}" "$base/api/generate?kind=analysis&limit=3"
          echo
          hour=$(TZ=Asia/Hong_Kong date +%H)
          weekday=$(TZ=Asia/Hong_Kong date +%u)
          if [ "$weekday" = "7" ] && [ "$hour" -ge 19 ]; then
            curl -fsS -X POST "${auth[@]}" "$base/api/generate?kind=weekly"
            echo
          fi
          # One briefing (three editions), then explainers.
          # Each explainer call writes up to five MiniMax pieces; three calls fill 15 per half-day.
          # Retry when the HTTP status is not 2xx or the body says "fallback": true
          # (cold cache, sources-only, or Workers AI standing in before the cap).
          # Explainers stop on pace, on none, or when the same non-empty keys repeat.
          # These endpoints never render the homepage.
          fail=0
          post() {
            url="$1"
            tries="$2"
            attempt=1
            while [ "$attempt" -le "$tries" ]; do
              body=$(mktemp)
              code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 90 -X POST "${auth[@]}" "$url" || true)
              cat "$body"
              echo
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && ! grep -q '"fallback":true' "$body"; then
                rm -f "$body"
                return 0
              fi
              rm -f "$body"
              attempt=$((attempt + 1))
              if [ "$attempt" -le "$tries" ]; then
                sleep 5
              fi
            done
            return 1
          }
          # Unscoped briefing writes Hong Kong, international, and tech/finance.
          # The scoped calls are idempotent if that edition is already ready.
          post "$base/api/generate?kind=briefing" 3 || fail=1
          post "$base/api/generate?kind=briefing&scope=world" 2 || fail=1
          post "$base/api/generate?kind=briefing&scope=techfin" 2 || fail=1
          prev_keys=""
          explainer_ok=0
          for _ in 1 2 3; do
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 90 -X POST "${auth[@]}" "$base/api/generate?kind=explainer&limit=3" || true)
            cat "$body"
            echo
            parsed=$(python3 -c 'import json,sys
try:
    data=json.load(open(sys.argv[1], encoding="utf-8"))
except Exception:
    data={}
keys=",".join(str(key) for key in (data.get("keys") or []))
print(keys + "\t" + str(data.get("skipped") or ""))' "$body")
            keys="${parsed%%$'\t'*}"
            skipped="${parsed#*$'\t'}"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && ! grep -q '"fallback":true' "$body"; then
              explainer_ok=1
              if [ "$skipped" = "pace" ] || [ "$skipped" = "none" ] || [ -z "$keys" ] || [ "$keys" = "$prev_keys" ]; then
                rm -f "$body"
                break
              fi
              prev_keys="$keys"
            fi
            rm -f "$body"
          done
          if [ "$explainer_ok" -eq 0 ]; then
            fail=1
          fi
          # Topic packs: at most two calls per warm run, no retry on fallback.
          # The handler writes one KV key per topic only when the text changed,
          # and only during the 07:30 and 18:30 HKT windows.
          topic_skip=""
          topic_round=0
          while [ "$topic_round" -lt 2 ]; do
            topic_round=$((topic_round + 1))
            topic_body=$(mktemp)
            topic_url="$base/api/generate?kind=topic"
            if [ -n "$topic_skip" ]; then
              topic_url="${topic_url}&skip=${topic_skip}"
            fi
            topic_code=$(curl -sS -o "$topic_body" -w '%{http_code}' --max-time 90 -X POST "${auth[@]}" "$topic_url" || true)
            cat "$topic_body"
            echo
            topic_parsed=$(python3 -c 'import json,sys
try:
    data=json.load(open(sys.argv[1], encoding="utf-8"))
except Exception:
    data={}
attempted=",".join(str(item) for item in (data.get("attempted") or []))
print(("1" if data.get("more") else "0") + "\t" + attempted)' "$topic_body")
            rm -f "$topic_body"
            if [ "$topic_code" -lt 200 ] || [ "$topic_code" -ge 300 ]; then
              fail=1
              break
            fi
            topic_more="${topic_parsed%%$'\t'*}"
            topic_attempted="${topic_parsed#*$'\t'}"
            if [ -n "$topic_attempted" ]; then
              topic_skip="${topic_skip:+$topic_skip,}${topic_attempted}"
            fi
            if [ "$topic_more" != "1" ]; then
              break
            fi
          done
          for _ in 1 2 3 4 5 6 7; do
            post "$base/api/generate?kind=focus&limit=3" 2 || fail=1
          done
          curl -fsS --retry 2 --retry-delay 2 --max-time 30 -X POST "${auth[@]}" "$base/api/generate?kind=status" || true
          echo
          exit "$fail"
