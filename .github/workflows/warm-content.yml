name: Warm AI pages

on:
  schedule:
    # 07:30 HKT
    - cron: '30 23 * * *'
    # 18:30 HKT
    - cron: '30 10 * * *'
    # Sunday 20:00 HKT
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Pages to generate the current edition
        env:
          GENERATE_SECRET: ${{ secrets.GENERATE_SECRET }}
          SITE_URL: ${{ vars.CONTENT_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GENERATE_SECRET}" ]; then
            echo "GENERATE_SECRET is not set"
            exit 1
          fi
          base="${SITE_URL:-https://world-news.xyz}"
          base="${base%/}"
          auth=(-H "x-generate-secret: ${GENERATE_SECRET}" -H "content-type: application/json")
          curl -fsS -X POST "${auth[@]}" "$base/api/generate?kind=digest"
          echo
          curl -fsS -X POST "${auth[@]}" "$base/api/generate?kind=analysis&limit=3"
          echo
          hour=$(TZ=Asia/Hong_Kong date +%H)
          weekday=$(TZ=Asia/Hong_Kong date +%u)
          if [ "$weekday" = "7" ] && [ "$hour" -ge 19 ]; then
            curl -fsS -X POST "${auth[@]}" "$base/api/generate?kind=weekly"
            echo
          fi
          # Briefing, comparisons, and focus intros run in small batches.
          # Retry when the HTTP status is not 2xx or the body says "fallback": true
          # (cold cache, sources-only, or Workers AI standing in before the cap).
          # These endpoints never render the homepage.
          fail=0
          post() {
            url="$1"
            tries="$2"
            attempt=1
            while [ "$attempt" -le "$tries" ]; do
              body=$(mktemp)
              code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 90 -X POST "${auth[@]}" "$url" || true)
              cat "$body"
              echo
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ] && ! grep -q '"fallback":true' "$body"; then
                rm -f "$body"
                return 0
              fi
              rm -f "$body"
              attempt=$((attempt + 1))
              if [ "$attempt" -le "$tries" ]; then
                sleep 5
              fi
            done
            return 1
          }
          post "$base/api/generate?kind=briefing" 3 || fail=1
          for _ in 1 2 3 4 5 6 7; do
            post "$base/api/generate?kind=explainer&limit=3" 3 || fail=1
          done
          for _ in 1 2 3 4 5 6 7; do
            post "$base/api/generate?kind=focus&limit=3" 2 || fail=1
          done
          curl -fsS --retry 2 --retry-delay 2 --max-time 30 -X POST "${auth[@]}" "$base/api/generate?kind=status" || true
          echo
          exit "$fail"
